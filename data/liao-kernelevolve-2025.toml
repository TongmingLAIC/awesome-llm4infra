summary = "An agentic kernel-coding framework deployed at Meta that generates and optimizes kernels for production recommendation models across NVIDIA and AMD GPUs and Meta's own accelerators, searching over several programming abstractions with retrieval-augmented prompts."
result = "[Meta's engineering post](https://engineering.fb.com/2026/04/02/developer-tools/kernelevolve-how-metas-ranking-engineer-agent-optimizes-ai-infrastructure/) reports over 60% higher inference throughput for the Andromeda ads model on NVIDIA GPUs and over 25% higher training throughput for an ads model on Meta's MTIA chips."

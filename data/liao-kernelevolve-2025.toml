title = "KernelEvolve: Scaling Agentic Kernel Coding for Heterogeneous AI Accelerators at Meta"
authors = ["Gang Liao", "Hongsen Qin", "Ying Wang", "Alicia Golden", "Michael Kuchnik", "Yavuz Yetim", "Jia Jiunn Ang", "Chunli Fu", "Yihan He", "Samuel Hsia", "Zewei Jiang", "Dianshi Li", "Uladzimir Pashkevich", "Varna Puvvada", "Feng Shi", "Matt Steiner", "Ruichao Xiao", "Liyuan Li", "Nathan Yan", "Xiayu Yu", "Zhou Fang", "Roman Levenstein", "Kunming Ho", "Haishan Zhu", "Alec Hammond", "Richard Li", "Ajit Mathews", "Kaustubh Gondkar", "Abdul Zainul-Abedin", "Ketan Singh", "Hongtao Yu", "Wenyuan Chi", "Barney Huang", "Sean Zhang", "Noah Weller", "Zach Marine", "Wyatt Cook", "Carole-Jean Wu", "Gaoxiang Liu"]

title = "VibeTensor: System Software for Deep Learning, Fully Generated by AI Agents"
authors = ["Bing Xu", "Terry Chen", "Fengzhe Zhou", "Tianqi Chen", "Yangqing Jia", "Vinod Grover", "Haicheng Wu", "Wei Liu", "Craig Wittenbrink", "Wen-mei Hwu", "Roger Bringmann", "Ming-Yu Liu", "Luis Ceze", "Michael Lightstone", "Humphrey Shi"]
date = 2026-01-21
arxiv = "2601.16238"
code = "https://github.com/NVlabs/vibetensor"
category = "training"
summary = "LLM coding agents, under high-level human guidance, generated a PyTorch-style deep-learning runtime (tensor storage, dispatcher, autograd, CUDA runtime and caching allocator), with every change an agent-proposed diff validated by agent-run builds and tests."
result = "End-to-end training sanity checks on three small workloads (sequence reversal, ViT and miniGPT) on H100 and Blackwell GPUs."

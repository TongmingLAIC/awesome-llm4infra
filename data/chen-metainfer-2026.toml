title = "Automatic Model-Hardware Co-Adaptation for Heterogeneous AI Accelerators"
authors = ["Tian Chen", "Mingheng Mi", "Pu Wang", "Chen Hu", "Hai Zhang"]
date = 2026-07-14
arxiv = "2607.12875"
code = "https://github.com/HuangPuStar/MetaInfer/tree/arxiv-paper"

summary = "MetaInfer, an LLM-agent system, adapts new models to existing accelerators by searching routes through a graph that links model semantics, framework dispatch, kernel choices and hardware, repairing blocked routes with patches and validating them with end-to-end profiling; shown on DeepSeek V4 Flash and GLM 5.3 Flash on NVIDIA A800 and DeepSeek V4 Flash on a Hygon K100AI DCU."

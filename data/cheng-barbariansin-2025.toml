title = "Let the Barbarians In: How AI Can Accelerate Systems Performance Research"
authors = ["Audrey Cheng", "Shu Liu", "Melissa Pan", "Zhifei Li", "Shubham Agarwal", "Mert Cemri", "Bowen Wang", "Alexander Krentsel", "Tian Xia", "Jongseok Park", "Shuo Yang", "Jeff Chen", "Lakshya Agrawal", "Ashwin Naren", "Shulu Li", "Ruiying Ma", "Aditya Desai", "Jiarong Xing", "Koushik Sen", "Matei Zaharia", "Ion Stoica"]
date = 2025-12-16
arxiv = "2512.14806"
category = "method"
summary = "Extends ADRS to ten case studies across three open-source frameworks (OpenEvolve, GEPA and ShinkaEvolve), including Mixture-of-Experts load balancing and multi-region cloud scheduling, and distills best practices for using them."
result = "ADRS-generated solutions match or outperform state-of-the-art human designs in the case studies."

summary = "AMD's LLM kernel agents start from profiles of real serving workloads in vLLM and SGLang, optimize the kernels that dominate them, and measure the result as end-to-end serving throughput."
result = "End-to-end serving-throughput gains of 60% on Qwen3.5-27B-FP8 and 96% on Qwen3-14B-FP8 (MI300X, SGLang, TP1, 1K input and output, concurrency 64), and 42.2% on MiniMax-M3-MXFP8 (MI355X, vLLM)."

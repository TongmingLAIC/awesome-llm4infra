title = "The Automated LLM Speedrunning Benchmark: Reproducing NanoGPT Improvements"
authors = ["Bingchen Zhao", "Despoina Magka", "Minqi Jiang", "Xian Li", "Roberta Raileanu", "Tatiana Shavrina", "Jean-Christophe Gagnon-Audet", "Kelvin Niu", "Shagun Sodhani", "Michael Shvartsman", "Andrei Lupu", "Alisia Lupidi", "Edan Toledo", "Karen Hambardzumyan", "Martin Josifoski", "Thomas Foster", "Lucia Cipolina-Kun", "Abhishek Charnalia", "Derek Dunfield", "Alexander H. Miller", "Oisin Mac Aodha", "Jakob Foerster", "Yoram Bachrach"]
date = 2025-06-27
arxiv = "2506.22419"
code = "https://github.com/facebookresearch/llm-speedrunner"
category = "benchmark"
summary = "19 tasks from the NanoGPT speedrun, each giving the agent the previous record's training script, optionally with hints, and asking it to reproduce the next record's speedup; the improvements range from algorithmic changes to hardware-aware optimizations."
result = "Recent reasoning LLMs with state-of-the-art scaffolds struggle to reimplement already-known improvements, even with detailed hints."

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Awesome LLM4Infra: LLMs and agents that optimize ML infrastructure end to end">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#18193f"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.92" cy="1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="serving" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="training" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="compilers" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.55"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c7d2fe"/>
    </marker>
    <clipPath id="card">
      <rect width="1280" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glowBlue)"/>
    <rect width="1280" height="320" fill="url(#glowViolet)"/>
  </g>

  <g font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="104" font-size="20" font-weight="700" letter-spacing="4" fill="#93c5fd">AWESOME</text>
    <text x="62" y="172" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#ffffff">LLM4Infra</text>
    <text x="64" y="218" font-size="23" fill="#cbd5e1">LLMs and agents that optimize</text>
    <text x="64" y="250" font-size="23" fill="#cbd5e1">ML infrastructure end to end</text>

    <!-- the optimizer -->
    <rect x="712" y="118" width="84" height="84" rx="20" fill="url(#agent)"/>
    <path d="M754 136 C756 152 760 156 776 160 C760 164 756 168 754 184 C752 168 748 164 732 160 C748 156 752 152 754 136 Z" fill="#ffffff"/>
    <text x="754" y="230" font-size="16" font-weight="600" fill="#e0e7ff" text-anchor="middle">LLM / agent</text>

    <!-- what it optimizes: everything above a single kernel -->
    <path d="M800 148 C840 148 846 76 892 76" fill="none" stroke="#c7d2fe" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M800 160 L892 136" fill="none" stroke="#c7d2fe" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M800 172 C840 172 846 196 892 196" fill="none" stroke="#c7d2fe" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="900" y="54" width="316" height="44" rx="10" fill="url(#serving)" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="922" y="83" font-size="18" font-weight="600" fill="#ffffff">Serving and inference</text>
    <rect x="900" y="114" width="316" height="44" rx="10" fill="url(#training)" stroke="#c4b5fd" stroke-opacity="0.5"/>
    <text x="922" y="143" font-size="18" font-weight="600" fill="#ffffff">Training</text>
    <rect x="900" y="174" width="316" height="44" rx="10" fill="url(#compilers)" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="922" y="203" font-size="18" font-weight="600" fill="#ffffff">Compilers</text>

    <!-- out of scope: single kernels -->
    <rect x="900" y="240" width="316" height="40" rx="10" fill="none" stroke="#64748b" stroke-dasharray="6 6"/>
    <text x="922" y="266" font-size="16" fill="#94a3b8">Single kernels: see the kernel lists</text>
  </g>
</svg>
